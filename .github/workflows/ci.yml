name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend – dotnet test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        working-directory: backend
        run: dotnet restore

      - name: Build
        working-directory: backend
        run: dotnet build --no-restore --configuration Release

      # Integrationstesterna startar Postgres via Testcontainers (Docker finns på ubuntu-runnern).
      - name: Test
        working-directory: backend
        run: dotnet test --no-build --configuration Release --verbosity normal

  frontend:
    name: Frontend – npm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  publish-images:
    name: Publicera ${{ matrix.image }}
    # Bara main bygger images; PR-jobben ovan validerar utan att pusha.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: valkompass-api
            context: ./backend
          - image: valkompass-frontend
            context: ./frontend
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Taggas med commit-SHA:t, aldrig "latest": overlayn i valkompass-gitops pekar på en
      # exakt tagg, så en rollback är att peka tillbaka på en tidigare SHA.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  promote-prod:
    name: Promota till produktion
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [publish-images]
    runs-on: ubuntu-latest

    steps:
      # GitHub App i stället för PAT: token't är kortlivat och scopat till enbart
      # valkompass-gitops. Samma app används av rewind, men nyckelparet läggs som
      # secrets på det här repot.
      - name: Skapa GitHub App-token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.GITOPS_CI_APP_ID }}
          private-key: ${{ secrets.GITOPS_CI_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: valkompass-gitops
          permission-contents: write

      - name: Checka ut GitOps-repot
        uses: actions/checkout@v7
        with:
          repository: palmmar/valkompass-gitops
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          path: gitops

      - name: Uppdatera image-taggar i prod-overlayn
        working-directory: gitops
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          # api och frontend ligger i samma overlay och ska alltid följa samma source-commit.
          path = Path("k8s/overlays/prod/kustomization.yaml")
          text = path.read_text()
          tag = os.environ["IMAGE_TAG"]

          for image in ("valkompass-api", "valkompass-frontend"):
              pattern = rf"(  - name: ghcr\.io/palmmar/{re.escape(image)}\n    newTag: )[^\n]+"
              text, count = re.subn(pattern, rf"\g<1>{tag}", text)
              if count != 1:
                  raise SystemExit(f"Förväntade exakt en image-post för {image}, hittade {count}")

          path.write_text(text)
          PY

      - name: Committa och pusha
        working-directory: gitops
        run: |
          if git diff --quiet; then
            echo "Produktion pekar redan på ${GITHUB_SHA}; inget att göra."
            exit 0
          fi

          git config user.name "Palmmar Valkompass CI"
          git config user.email "valkompass-ci@users.noreply.github.com"

          git add k8s/overlays/prod/kustomization.yaml
          git commit -m "Promota Valkompass produktion till ${GITHUB_SHA}"
          git push origin main
