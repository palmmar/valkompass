name: CI

on:
  push:
    branches: [main]
  # Inget branches-filter här: en PR mot en ANNAN gren än main (staplade PR:er) ska också
  # byggas, annars granskas den overifierad. Bygg- och testjobben är det enda som tillkommer
  # — publicering och promotion är gatade på push till main längre ned.
  pull_request:

jobs:
  backend:
    name: Backend – dotnet test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        working-directory: backend
        run: dotnet restore

      - name: Build
        working-directory: backend
        run: dotnet build --no-restore --configuration Release

      # Integrationstesterna startar Postgres via Testcontainers (Docker finns på ubuntu-runnern).
      - name: Test
        working-directory: backend
        run: dotnet test --no-build --configuration Release --verbosity normal

  frontend:
    name: Frontend – npm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
