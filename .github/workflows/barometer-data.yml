name: Uppdatera barometerdata

# Hämtar färska opinionsmätningar (SwedishPolls + SCB:s PSU) varje natt och committar
# polls.json DIREKT till main när datan ändrats. Coolify auto-deployar på push till main, så
# sidan alltid visar senaste mätningarna. Seedningen är append-only (nya mätningar fylls på,
# inget skrivs över → ofarlig omstart). En sanity-grind hindrar att trasig/ofullständig
# uppströmsdata publiceras: antalet mätningar får aldrig minska.
#
# OBS: cron är i UTC. "0 3 * * *" = 03:00 UTC ≈ 04–05 svensk tid. Vill du ha 03:00 svensk
# tid, använd "0 1 * * *" (sommartid) / "0 2 * * *" (vintertid).
#
# Kräver att github-actions-botten får pusha till main (ingen "require pull request"-skydd,
# eller ett undantag för botten).

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: barometer-data
  cancel-in-progress: false

jobs:
  refresh:
    name: Hämta och uppdatera main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Generera och validera polls.json
        run: |
          set -euo pipefail
          FILE=backend/src/Valkompass.Infrastructure/Seed/Content/polls.json
          OLD=$(git show "HEAD:$FILE" | python3 -c "import json,sys; print(len(json.load(sys.stdin)['polls']))")
          python3 backend/tools/gen_polls.py
          python3 -c "import json,sys; d=json.load(open(sys.argv[1],encoding='utf-8')); new=len(d['polls']); old=int(sys.argv[2]); assert d.get('pollsters'), 'saknar pollsters'; assert new>=old, f'antal matningar minskade {old}->{new} – avbryter'; print(f'OK: {old} -> {new} matningar')" "$FILE" "$OLD"

      - name: Committa till main vid förändring
        run: |
          set -euo pipefail
          FILE=backend/src/Valkompass.Infrastructure/Seed/Content/polls.json
          if git diff --quiet -- "$FILE"; then
            echo "Ingen förändring i barometerdata – inget att deploya."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "Uppdatera barometerdata (SwedishPolls + SCB)"
          git push origin HEAD:main
          echo "Pushade till main – Coolify deployar."
